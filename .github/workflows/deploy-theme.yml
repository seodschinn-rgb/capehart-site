name: Deploy Capehart WordPress theme

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      commit_sha:
        description: Tested 40-character staging commit SHA (required for production)
        required: false
        type: string
      confirm_production:
        description: Type DEPLOY_PRODUCTION for a production deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: capehart-theme-${{ github.event_name == 'push' && 'staging' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      STAGING_HOST: ${{ secrets.ROCKET_STAGING_HOST }}
      STAGING_USER: ${{ secrets.ROCKET_STAGING_USER }}
      STAGING_PRIVATE_KEY: ${{ secrets.ROCKET_STAGING_PRIVATE_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.ROCKET_STAGING_KNOWN_HOSTS }}
      STAGING_SITE_URL: ${{ secrets.ROCKET_STAGING_SITE_URL }}
      PRODUCTION_HOST: ${{ secrets.ROCKET_PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.ROCKET_PRODUCTION_USER }}
      PRODUCTION_PRIVATE_KEY: ${{ secrets.ROCKET_PRODUCTION_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.ROCKET_PRODUCTION_KNOWN_HOSTS }}
      PRODUCTION_SITE_URL: ${{ secrets.ROCKET_PRODUCTION_SITE_URL }}

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

      - name: Confirm the exact deployable commit
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_sha="$(git rev-parse HEAD)"

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Git did not resolve a valid deployable commit.' >&2
            exit 1
          fi

          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'Production requires the complete 40-character staging commit SHA.' >&2
              exit 1
            fi
            if [[ "${REQUESTED_SHA,,}" != "$deploy_sha" ]]; then
              echo 'The checked-out commit does not match the requested production SHA.' >&2
              exit 1
            fi
            if [[ "$CONFIRM_PRODUCTION" != "DEPLOY_PRODUCTION" ]]; then
              echo 'Production deployment was not explicitly confirmed.' >&2
              exit 1
            fi

            git show-ref --verify --quiet refs/remotes/origin/staging || {
              echo 'The staging branch is unavailable in the checked-out repository.' >&2
              exit 1
            }
            git merge-base --is-ancestor "$deploy_sha" origin/staging || {
              echo 'Production can deploy only a commit that exists on the staging branch.' >&2
              exit 1
            }
          elif [[ "$DEPLOY_TARGET" != "staging" ]]; then
            echo "Unsupported deployment target: $DEPLOY_TARGET" >&2
            exit 1
          fi

          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Build and validate an allowlisted theme package
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v php >/dev/null
          command -v jq >/dev/null
          command -v rsync >/dev/null

          package_dir="$RUNNER_TEMP/capehart-package"
          mkdir -p "$package_dir"

          allowed=(
            assets inc languages parts patterns styles templates
            functions.php index.php rtl.css screenshot.png style.css theme.json
          )
          archive_paths=()
          for item in "${allowed[@]}"; do
            if git cat-file -e "$DEPLOY_SHA:$item" 2>/dev/null; then
              archive_paths+=("$item")
            fi
          done

          git archive --format=tar "$DEPLOY_SHA" "${archive_paths[@]}" |
            tar -xf - -C "$package_dir"

          test -f "$package_dir/style.css"
          test -f "$package_dir/theme.json"
          test -f "$package_dir/functions.php"
          test -d "$package_dir/templates"
          test -d "$package_dir/parts"
          grep -Fq 'Theme Name: Capehart Custom' "$package_dir/style.css"
          jq -e . "$package_dir/theme.json" >/dev/null

          while IFS= read -r -d '' php_file; do
            php -l "$php_file"
          done < <(find "$package_dir" -type f -name '*.php' -print0)

          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Configure verified Rocket.net SSH access
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$DEPLOY_TARGET" == "production" ]]; then
            rocket_host="$PRODUCTION_HOST"
            rocket_user="$PRODUCTION_USER"
            private_key="$PRODUCTION_PRIVATE_KEY"
            known_hosts="$PRODUCTION_KNOWN_HOSTS"
            site_url="$PRODUCTION_SITE_URL"
          else
            rocket_host="$STAGING_HOST"
            rocket_user="$STAGING_USER"
            private_key="$STAGING_PRIVATE_KEY"
            known_hosts="$STAGING_KNOWN_HOSTS"
            site_url="$STAGING_SITE_URL"
          fi

          : "${rocket_host:?Missing Rocket.net host secret}"
          : "${rocket_user:?Missing Rocket.net user secret}"
          : "${private_key:?Missing Rocket.net private-key secret}"
          : "${known_hosts:?Missing Rocket.net known-hosts secret}"

          if [[ ! "$rocket_host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'The Rocket.net host contains unsupported characters.' >&2
            exit 1
          fi
          if [[ ! "$rocket_user" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'The Rocket.net SSH username contains unsupported characters.' >&2
            exit 1
          fi
          if [[ -n "$site_url" && ! "$site_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo 'The optional health-check URL must be an HTTPS site origin.' >&2
            exit 1
          fi

          {
            echo "ROCKET_HOST=$rocket_host"
            echo "ROCKET_USER=$rocket_user"
            echo "ROCKET_SITE_URL=$site_url"
          } >> "$GITHUB_ENV"

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$private_key" | tr -d '\r' > "$HOME/.ssh/capehart_deploy"
          printf '%s\n' "$known_hosts" | tr -d '\r' > "$HOME/.ssh/known_hosts"

          {
            echo 'Host rocket-capehart'
            echo "  HostName $rocket_host"
            echo "  User $rocket_user"
            echo '  Port 22'
            echo "  IdentityFile $HOME/.ssh/capehart_deploy"
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
            echo '  StrictHostKeyChecking yes'
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo '  ConnectTimeout 20'
            echo '  ServerAliveInterval 30'
          } > "$HOME/.ssh/config"

      - name: Verify Rocket.net and prepare an isolated incoming directory
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- prepare '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Upload the allowlisted package
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync \
            --recursive \
            --links \
            --perms \
            --times \
            --compress \
            --checksum \
            --delete-delay \
            --no-owner \
            --no-group \
            --chmod='D755,F644' \
            "$PACKAGE_DIR/" \
            "rocket-capehart:public_html/wp-content/themes/.capehart-custom.incoming-$DEPLOY_SHA/"

      - name: Validate remotely, back up, and atomically activate the files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- activate '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Check the site response
        if: ${{ env.ROCKET_SITE_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="${ROCKET_SITE_URL%/}/?capehart-deploy=$DEPLOY_SHA"
          if ! curl --fail --silent --show-error --location --retry 3 --max-time 30 "$health_url" >/dev/null; then
            ssh rocket-capehart "bash -s -- rollback '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh
            echo 'The HTTP health check failed; the previous theme files were restored.' >&2
            exit 1
          fi

      - name: Purge caches and finalize the deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- finalize '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/capehart_deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
