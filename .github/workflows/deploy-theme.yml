name: Deploy Capehart theme to Rocket.net

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional 40-character main-branch commit SHA for rollback/redeploy
        required: false
        type: string
      confirm_live:
        description: Type DEPLOY_LIVE when starting the workflow manually
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: capehart-theme-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy live theme files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      CONFIRM_LIVE: ${{ inputs.confirm_live }}
      ROCKET_HOST: ${{ secrets.ROCKET_HOST }}
      ROCKET_USER: ${{ secrets.ROCKET_USER }}
      ROCKET_PRIVATE_KEY: ${{ secrets.ROCKET_PRIVATE_KEY }}
      ROCKET_KNOWN_HOSTS: ${{ secrets.ROCKET_KNOWN_HOSTS }}
      ROCKET_SITE_URL: ${{ secrets.ROCKET_SITE_URL }}

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Confirm the exact deployable commit
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_sha="$(git rev-parse HEAD)"

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Git did not resolve a valid deployable commit.' >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "$CONFIRM_LIVE" != "DEPLOY_LIVE" ]]; then
              echo 'A manual live deployment requires the confirmation DEPLOY_LIVE.' >&2
              exit 1
            fi
            if [[ -n "$REQUESTED_SHA" ]]; then
              if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ || "${REQUESTED_SHA,,}" != "$deploy_sha" ]]; then
                echo 'The requested SHA is invalid or differs from the checked-out commit.' >&2
                exit 1
              fi
            fi
          fi

          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo 'The main branch is unavailable in the checked-out repository.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$deploy_sha" origin/main || {
            echo 'Only commits contained in the main branch may be deployed live.' >&2
            exit 1
          }

          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Build and validate an allowlisted theme package
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v php >/dev/null
          command -v jq >/dev/null
          command -v rsync >/dev/null

          package_dir="$RUNNER_TEMP/capehart-package"
          mkdir -p "$package_dir"

          allowed=(
            assets inc languages parts patterns styles templates
            functions.php index.php rtl.css screenshot.png style.css theme.json
          )
          archive_paths=()
          for item in "${allowed[@]}"; do
            if git cat-file -e "$DEPLOY_SHA:$item" 2>/dev/null; then
              archive_paths+=("$item")
            fi
          done

          git archive --format=tar "$DEPLOY_SHA" "${archive_paths[@]}" |
            tar -xf - -C "$package_dir"

          test -f "$package_dir/style.css"
          test -f "$package_dir/theme.json"
          test -f "$package_dir/functions.php"
          test -d "$package_dir/templates"
          test -d "$package_dir/parts"
          grep -Fq 'Theme Name: Capehart Custom' "$package_dir/style.css"
          jq -e . "$package_dir/theme.json" >/dev/null

          find "$package_dir" -type f -name '*.php' -exec php -l {} \;

          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Configure verified Rocket.net SSH access
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${ROCKET_HOST:?Missing ROCKET_HOST secret}"
          : "${ROCKET_USER:?Missing ROCKET_USER secret}"
          : "${ROCKET_PRIVATE_KEY:?Missing ROCKET_PRIVATE_KEY secret}"
          : "${ROCKET_KNOWN_HOSTS:?Missing ROCKET_KNOWN_HOSTS secret}"

          if [[ ! "$ROCKET_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'The Rocket.net host contains unsupported characters.' >&2
            exit 1
          fi
          if [[ ! "$ROCKET_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'The Rocket.net SSH username contains unsupported characters.' >&2
            exit 1
          fi
          if [[ -n "$ROCKET_SITE_URL" && ! "$ROCKET_SITE_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo 'ROCKET_SITE_URL must be an HTTPS site origin.' >&2
            exit 1
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ROCKET_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/capehart_deploy"
          printf '%s\n' "$ROCKET_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"

          {
            echo 'Host rocket-capehart'
            echo "  HostName $ROCKET_HOST"
            echo "  User $ROCKET_USER"
            echo '  Port 22'
            echo "  IdentityFile $HOME/.ssh/capehart_deploy"
            echo '  IdentitiesOnly yes'
            echo '  BatchMode yes'
            echo '  StrictHostKeyChecking yes'
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo '  ConnectTimeout 20'
            echo '  ServerAliveInterval 30'
          } > "$HOME/.ssh/config"

      - name: Verify Rocket.net and prepare an isolated incoming directory
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- prepare '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Upload the allowlisted package
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync \
            --recursive \
            --links \
            --perms \
            --times \
            --compress \
            --checksum \
            --delete-delay \
            --no-owner \
            --no-group \
            --chmod='D755,F644' \
            "$PACKAGE_DIR/" \
            "rocket-capehart:public_html/wp-content/themes/.capehart-custom.incoming-$DEPLOY_SHA/"

      - name: Validate remotely, back up, and atomically activate the files
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- activate '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Check the live site response
        if: ${{ env.ROCKET_SITE_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          health_url="${ROCKET_SITE_URL%/}/?capehart-deploy=$DEPLOY_SHA"
          if ! curl --fail --silent --show-error --location --retry 3 --max-time 30 "$health_url" >/dev/null; then
            ssh rocket-capehart "bash -s -- rollback '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh
            echo 'The HTTP health check failed; the previous theme files were restored.' >&2
            exit 1
          fi

      - name: Purge caches and finalize the deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh rocket-capehart "bash -s -- finalize '$DEPLOY_SHA'" < .github/scripts/rocket-theme-deploy.sh

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/capehart_deploy" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
